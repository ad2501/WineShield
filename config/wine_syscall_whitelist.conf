# WineShield Syscall Whitelist — Strict Mode
# ==========================================
# This file defines the set of Linux syscalls permitted in STRICT mode.
# Every syscall must be justified by documented Wine behavior.
#
# How this was built:
#   1. Wine 10.0 source code analysis (dlls/ntdll/unix/, server/, dlls/kernelbase/)
#   2. strace profiling of common Windows applications (notepad++, 7zip, calc)
#   3. Firejail Wine profile reference
#   4. Linux man pages for syscall behavior and security implications
#
# Format:
#   # comment describing why this is needed
#   syscall_name: justification
#
# Whitelist version: 1.0.0-alpha
# Last updated: 2026-06-09
# Target: x86_64 Linux (Wine 10.0, Ubuntu 22.04+)

# =============================================================================
# CATEGORY 1: Process and Thread Management
# =============================================================================

clone:           # Process/thread creation. Wine creates one thread per Windows
                 # thread via clone(CLONE_VM|CLONE_THREAD). Also used by wineserver.
                 # CRITICAL: must filter CLONE_NEWNS|CLONE_NEWNET flags in code.

fork:            # Process creation. Used sparingly by Wine internals.
                 # Most thread creation goes through clone() instead.

vfork:           # Fast process creation. Used during Wine process startup.

exit:            # Thread/process exit. Every process must be able to call this.

exit_group:      # Kill all threads in a process. Used on abnormal termination.

getpid:          # Get process ID. Wine maintains its own PID <-> TID mapping.
                 # Heavily used by ntdll for process identity management.

gettid:          # Get thread ID. Used by Wine's threading implementation.

getppid:         # Get parent process ID. Used by wineserver for parent tracking.

wait4:           # Wait for process change. Used by wineserver to reap children.

waitid:          # Wait for child state change. Used in process management.

sched_yield:     # Yield CPU voluntarily. Used by spinlocks in Wine.

sched_getparam:  # Get scheduling parameters. Used by Windows GetPriorityClass().

sched_setparam:  # Set scheduling parameters. Used by Windows SetPriorityClass().

sched_getscheduler:      # Query scheduling policy. Used by Windows priority API.
sched_setscheduler:       # Set scheduling policy. Used by Windows priority API.
sched_get_priority_max:  # Get priority range. Used by Windows thread priority API.
sched_get_priority_min:  # Get priority range. Used by Windows thread priority API.
sched_getattr:           # Get extended scheduling attributes (Linux 3.14+).
sched_setattr:           # Set extended scheduling attributes.
sched_rr_get_interval:   # Get RR quantum. Used by Windows scheduling API.

set_robust_list:   # Robust futex list. REQUIRED for glibc thread cleanup.
                   # Without this, thread cancellation causes memory corruption.

get_robust_list:   # Query robust futex list. Used in thread cleanup.

rseq:              # Restartable sequences (Linux 4.18+). Used by glibc for
                   # per-CPU operations. Calling thread exits if blocked.

prctl:             # Process operations. Used for: PR_SET_NAME (thread naming),
                   # PR_SET_PDEATHSIG (signal on parent death), PR_GET_DUMPABLE.
                   # CRITICAL: must NOT allow PR_SET_SECCOMP (would override filter)
                   # or PR_SET_NO_NEW_PRIVS (already set by WineShield).

arch_prctl:        # Architecture-specific process state. Used by Wine for
                   # setting TLS segment registers (ARCH_SET_FS, ARCH_SET_GS)
                   # which is essential for Windows thread-local storage.

# =============================================================================
# CATEGORY 2: Memory Management
# =============================================================================

mmap:              # Map files/devices into memory. Wine maps PE files, DLLs,
                   # and shared memory regions. Also used for heap allocation.
                   # CRITICAL: consider mmap prot flags filtering for extra safety.

munmap:            # Unmap memory. Used for cleanup when unloading DLLs.

mprotect:          # Change memory protections. REQUIRED by Wine's JIT and
                   # by the Windows VirtualProtect() API used in most programs.
                   # TRADE-OFF: also used by exploits to make heap executable.
                   # Alternative: restrict to PROT_READ|PROT_WRITE only,
                   # deny PROT_EXEC to prevent shellcode execution.

brk:               # Change data segment size. Used by glibc malloc().
                   # Lightweight heap management.

mremap:            # Remap virtual memory. Used by Wine for resizing mappings.

msync:             # Synchronize mapped memory to backing file.
                   # Used by Windows FlushViewOfFile().

mlock:             # Lock memory to prevent paging. Used by Windows
                   # VirtualLock() API. Can be used for side-channel
                   # resistance if needed.

munlock:           # Unlock memory. Paired with mlock.

mlockall:          # Lock all memory. Rarely used by Wine but available.
                   # Used by real-time audio applications.

munlockall:        # Unlock all memory. Paired with mlockall.

madvise:           # Advise memory usage patterns. Heavily used for:
                   # MADV_DONTNEED (free pages), MADV_WILLNEED (prefetch),
                   # MADV_COLD (page hinting), MADV_PAGEOUT.
                   # Wine uses this extensively for memory management.

process_madvise:   # Advise another process's memory (Linux 5.10+).
                   # Used by wineserver for cross-process memory management.

# =============================================================================
# CATEGORY 3: File I/O
# =============================================================================

read:              # Read from file descriptor. Fundamental I/O operation.

write:             # Write to file descriptor. Fundamental I/O operation.

pread64:           # Positional read. Used for threaded/async file reading.
                   # Avoids seek race conditions in multi-threaded code.

pwrite64:          # Positional write. As above, for writing.

readv:             # Scatter/gather read. Used by Wine's async I/O implementation.
                   # More efficient than multiple read() calls.

writev:            # Scatter/gather write. Used heavily for network I/O.

open:              # Open file. Being replaced by openat in modern code.

openat:            # Open file relative to directory fd. Preferred modern API.
                   # Wine 10.0 uses this extensively in ntdll.

close:             # Close file descriptor.

lseek:             # Reposition file offset. Used for random file access.

ftruncate:         # Truncate a file. Used by Windows SetEndOfFile().

fallocate:         # Preallocate file space. Used by file download operations.

fstat:             # Get file stat by fd. EXTREMELY common in Wine.

stat:              # Get file stat by path. Used for file attribute queries.

lstat:             # Get file stat (don't follow symlinks). Used by Wine loader.

newfstatat:        # Modern stat-at-directory-fd. Replaces stat() in new code.

access:            # Check file accessibility. Used by Wine for permission checks.

faccessat:         # Modern access-at-directory-fd. Used in Wine 10.

readlink:          # Read symlink target. Used by Wine for /proc/self/exe
                   # and WINEPREFIX resolution.

readlinkat:        # Modern readlink. Used in newer Wine code.

getdents:          # List directory entries (old). Being replaced.

getdents64:        # List directory entries. Used by Windows FindFirstFile().

fcntl:             # File descriptor control. Used for:
                   # F_GETFD, F_SETFD (close-on-exec)
                   # F_GETFL, F_SETFL (O_NONBLOCK flag)
                   # F_GETLK, F_SETLK, F_SETLKW (file locking)
                   # F_DUPFD (duplicate fd)
                   # F_GETPIPE_SZ, F_SETPIPE_SZ (pipe buffer size)

flock:             # File locking. Used by Windows LockFile() API.

dup:               # Duplicate file descriptor. Used for redirecting I/O.

dup2:              # Duplicate to specific fd. Used for stdin/stdout/stderr.

dup3:              # Modern dup with flags. Used in newer Wine.

pipe:              # Create pipe. Used for inter-thread communication.

pipe2:             # Modern pipe with flags. Used in newer Wine.

eventfd:           # Event notification fd (old).

eventfd2:          # Event notification fd. Used by wineserver for signaling.

ioctl:             # Device I/O control. Used for:
                   # TIOCGWINSZ (terminal size)
                   # FIONBIO (non-blocking IO)
                   # SIOCGIFCONF, etc. (network interface query)
                   # CDROM_* (CD-ROM access for Windows apps)
                   # TCGETS (terminal attributes)

statfs:            # Get filesystem info. Used by Windows GetDiskFreeSpace().
fstatfs:           # Get filesystem info by fd.
statx:             # Modern extended stat (Linux 4.11+). Used in Wine 10.

copy_file_range:   # Copy data between file descriptors (kernel-space).
                   # Used by Wine file operations for efficiency.

sendfile:          # Copy data between fds efficiently. Used by Wine's socket code.

splice:            # Splice data between fds. Used by wineserver for I/O.

# =============================================================================
# CATEGORY 4: Signal Handling
# =============================================================================

rt_sigaction:      # Set signal handler. Wine installs handlers for SIGSEGV,
                   # SIGILL, SIGFPE (Windows structured exception handling).
                   # Also uses SIGCHLD for child process management.
                   # REQUIRED for SEH (Structured Exception Handling) support.

rt_sigprocmask:    # Block/unblock signals. Used during critical sections.

rt_sigreturn:      # Return from signal handler. REQUIRED for SEH unwinding.

rt_sigtimedwait:   # Synchronously wait for signals. Used by wineserver.

rt_sigpending:     # Query pending signals. Used by Wine internal threads.

kill:              # Send signal. Used for: SIGTERM (clean shutdown),
                   # SIGUSR1/SIGUSR2 (internal Wine signaling).

tgkill:            # Send signal to specific thread. Used by Wine debugger.

tkill:             # Send signal to single thread (legacy).

sigaltstack:       # Set alternate signal stack. Used for handling SIGSEGV
                   # on a separate stack (required for reliable crash handling).

# =============================================================================
# CATEGORY 5: Time and Timers
# =============================================================================

clock_gettime:     # Get clock time. EXTREMELY frequent. Wine reads
                   # CLOCK_MONOTONIC and CLOCK_REALTIME constantly.
                   # Performance-critical: add to BPF whitelist early.

clock_getres:      # Get clock resolution. Used for timer precision queries.

clock_nanosleep:   # High-resolution sleep. Used by Windows Sleep() and
                   # WaitForSingleObject() timeouts.

nanosleep:         # Sleep for nanoseconds. Used by polling loops.

gettimeofday:      # Get time of day. Legacy, but still used.

time:              # Get wall-clock time. Used by many Windows apps.

settimeofday:      # Set time of day. Only wineserver needs this rarely.

adjtimex:          # Adjust kernel clock. Used by NTP-synced applications.

timerfd_create:    # Create timer fd. Used for Windows timer queue.

timerfd_settime:   # Arm a timer fd. Used for timer queue events.

timerfd_gettime:   # Get remaining timer time. Used for timer queries.

# =============================================================================
# CATEGORY 6: Network I/O
# =============================================================================

socket:            # Create socket. Used for TCP/UDP connections.
                   # CRITICAL: can restrict domain to AF_INET|AF_INET6|AF_UNIX.

connect:           # Connect to remote host. Used by most Windows apps.

bind:              # Bind to local port. Used by server applications.

listen:            # Listen for connections. Used by server applications.

accept:            # Accept incoming connection. Used by server applications.

accept4:           # Modern accept with flags. Used in newer Wine.

sendto:            # Send data to specific address. Used for UDP.

sendmsg:           # Send message with ancillary data. Advanced network I/O.

sendmmsg:          # Send multiple messages (Linux 3.0+). Bulk send.

recvfrom:          # Receive data from socket. Used for both TCP and UDP.

recvmsg:           # Receive message with ancillary data. Advanced network I/O.

recvmmsg:          # Receive multiple messages (Linux 2.6.33+). Bulk receive.

getsockname:       # Get local socket address. Used for network queries.

getpeername:       # Get remote socket address. Used for connection queries.

getsockopt:        # Get socket options. Used frequently.

setsockopt:        # Set socket options. Used frequently.

shutdown:          # Shut down socket connection. Used for graceful close.

sockopt:           # Legacy socket option manipulation.

socketpair:        # Create pair of connected sockets. Used by wineserver IPC.

# =============================================================================
# CATEGORY 7: Filesystem Structure
# =============================================================================

mkdir:             # Create directory. Used by Wine for prefix creation.

mkdirat:           # Modern mkdir. Used in newer Wine.

rmdir:             # Remove directory. Used by file management.

unlink:            # Remove file. Used by Windows DeleteFile().

unlinkat:          # Modern unlink. Used in Wine 10.

rename:            # Rename file. Used by Windows MoveFile().

renameat:          # Modern rename. Used in newer Wine.

symlink:           # Create symbolic link. Used by Wine prefix setup.
                   # Creates version-specific links to DLLs.

readlink:          # already in Category 3

link:              # Create hard link. Used by Wine prefix setup.

linkat:            # Modern link. Used in newer Wine.

chdir:             # Change current directory. Used frequently.

fchdir:            # Change directory by fd. Used in thread-safe code.

getcwd:            # Get current directory. Very frequent.

getxattr:          # Get extended attribute. Used by Wine for SELinux/AppArmor
                   # context queries and for ACL compatibility on Wine-managed
                   # files. Also used by some filesystem-backed features.
lgetxattr:         # Get extended attribute (no symlink follow).
fgetxattr:         # Get extended attribute by fd.
listxattr:         # List extended attributes.
llistxattr:        # List extended attributes (no symlink follow).
flistxattr:        # List extended attributes by fd.
setxattr:          # Set extended attribute. Used by Wine prefix management
                   # to store metadata in xattrs.
lsetxattr:         # Set extended attribute (no symlink follow).
fsetxattr:         # Set extended attribute by fd.
removexattr:       # Remove extended attribute.
lremovexattr:      # Remove extended attribute (no symlink follow).
fremovexattr:      # Remove extended attribute by fd.

# =============================================================================
# CATEGORY 8: System Information
# =============================================================================

uname:             # Get system name. Used by Windows GetVersionEx().
                   # Wine intercepts this to report Windows version.

sysinfo:           # Get system memory/load info. Used by performance counters.

getuid:            # Get user ID. Used by Wine permission checks.
geteuid:           # Get effective user ID.
getgid:            # Get group ID.
getegid:           # Get effective group ID.

getresuid:         # Get real/effective/saved UID. Security queries.
getresgid:         # Get real/effective/saved GID.

getgroups:         # Get supplementary group list. Permission checks.

setuid:            # Set user ID. Rare in Wine, but used by wineserver
                   # for privilege separation in some configurations.

setgid:            # Set group ID. Paired with setuid.

setgroups:         # Set supplementary groups. Used with privilege separation.

getrlimit:         # Get resource limits. Used by Windows API.

setrlimit:         # Set resource limits. Used by Wine for sandbox adjustments.

prlimit64:         # Modern get/set resource limits. Used in Wine 10.

getrusage:         # Get resource usage. Used by Windows GetProcessTimes().

times:             # Get process times. Used by performance timing.

syslog:            # Read kernel log. Sometimes used for debugging.

capget:            # Get process capabilities. Used for capability queries.

capset:            # Set process capabilities. Used in privilege management.

personality:       # Set process execution domain. Used by some Wine configurations.

# =============================================================================
# CATEGORY 9: I/O Multiplexing
# =============================================================================

poll:              # Wait for I/O events. Used by X11 event handling.

ppoll:             # Safer poll with signal mask. Modern alternative.

select:            # Legacy I/O multiplexing. Still used by Wine for compat.

pselect6:          # Safer select with signal mask. Modern alternative.

epoll_create:      # Create epoll instance. Used by wineserver event loop.

epoll_create1:     # Modern epoll create. Used in newer Wine.

epoll_ctl:         # Control epoll events. Used for fd monitoring.

epoll_wait:        # Wait for epoll events. Core of wineserver event loop.

epoll_pwait:       # Epoll wait with signal mask.

ppoll:             # previously listed

# =============================================================================
# CATEGORY 10: Miscellaneous — Rare but Required
# =============================================================================

syscall:           # Invoke another syscall (via syscall instruction).
                   # Used by Wine's syscall dispatch mechanism (int80 on i386,
                   # syscall on x86_64). TRADE-OFF: wide surface.

getrandom:         # Get random bytes (Linux 3.17+). Used by:
                   # - Random number generation in Windows apps
                   # - Wine's internal crypto (UUID generation)
                   # - TLS session key generation
                   # - ASLR within Wine

gettls:            # Get thread-local storage (deprecated).

set_tls:           # Set TLS area for current thread. Used by Wine's
                   # native threading implementation.

modify_ldt:        # Modify LDT (Local Descriptor Table).
                   # Used by Wine for 16-bit segment selector emulation.
                   # REQUIRED for 16-bit Windows applications.
                   # Can be blocked if 16-bit support is not needed.

pivot_root:        # Change root filesystem. Used for filesystem namespace
                   # setup by sandbox_engine.py, not by Wine itself.

mount:             # Mount filesystem. Used by sandbox_engine.py for OverlayFS
                   # and for /proc, /sys, /dev mounts inside the namespace.
                   # NOT needed by Wine processes directly.

umount2:           # Unmount filesystem. Used by sandbox cleanup.

unshare:           # Disassociate from namespace. Used by sandbox_engine.py
                   # to create new namespaces for Wine.

# =============================================================================
# EXPLICITLY BLOCKED SYSCALLS (in Balanced mode)
# =============================================================================
# These are dangerous syscalls that Wine NEVER legitimately needs.
#
# ptrace:           # Process tracing and debugging. PRIMARY exploit vector.
# init_module:      # Load kernel modules. KERNEL COMPROMISE vector.
# delete_module:    # Unload kernel modules.
# kexec_load:       # Load a new kernel for kexec. SYSTEM HIJACK.
# kexec_file_load:  # Load kernel via fd. Same as above.
# create_module:    # Create kernel module (obsolete).
# iopl:             # Change I/O privilege level. HARDWARE ACCESS.
# ioperm:           # Set I/O permissions. HARDWARE ACCESS.
# bpf:              # Load BPF programs. SANDBOX ESCAPE via BPF.
# perf_event_open:  # Performance monitoring. CAN READ KERNEL DATA.
# set_mempolicy:    # Set NUMA memory policy. DAMAGE CONTROL.
# mbind:            # Set memory binding policy.
# migrate_pages:    # Migrate pages between nodes.
# move_pages:       # Move pages between nodes.
# swapcontext:      # Swap ucontext. CONTROL FLOW HIJACK.
# uselib:           # Load shared library (obsolete). BYPASSES SECCOMP.
# acct:             # Switch accounting on/off. SYSTEM MANIPULATION.
# process_vm_readv:  # Read remote process memory. PROCESS INJECTION.
# process_vm_writev: # Write remote process memory. PROCESS INJECTION.
# seccomp:          # Install seccomp filter. OVERRIDES WINESHIELD.
# lookup_dcookie:   # Look up cookie. INFORMATION LEAK.
# vhangup:          # Virtually hang up. SYSTEM DISRUPTION.
# reboot:           # Reboot system. SYSTEM DISRUPTION.
# nfsservctl:       # NFS server control (obsolete).
# pciconfig_read:   # PCI config read (deprecated).
# pciconfig_write:  # PCI config write (deprecated).
# swapon:           # Enable swap device. SYSTEM MANIPULATION.
# swapoff:          # Disable swap device.
# sysfs:            # Get filesystem type info (obsolete).
# _sysctl:          # Read/write kernel parameters. SYSTEM MANIPULATION.
# iopl:             # already blocked
# vm86old:          # Enter virtual 8086 mode.
# vm86:             # Enter virtual 8086 mode.
# create_module:    # already blocked
# get_kernel_syms:  # Get kernel symbols (obsolete).
# query_module:     # Query module info (obsolete).
# nfsservctl:       # already blocked
# getpmsg:          # STREAMS message (obsolete).
# putpmsg:          # STREAMS message (obsolete).
# afs_syscall:      # AFS syscall (obsolete).
# tuxcall:          # TUX syscall (obsolete).
# security:         # Security syscall (obsolete).
# break:            # Break syscall (obsolete).

# =============================================================================
# REFERENCE
# =============================================================================
# Total whitelisted: ~120 syscalls
# Total blocked (Balanced): ~25 dangerous syscalls
# Linux total: ~450 syscalls (x86_64)
#
# Whitelist coverage: ~27% of all syscalls
# Blocked in Balanced: ~6% of all syscalls
#
# Methodology references:
#   - Wine git: https://gitlab.winehq.org/wine/wine
#   - Firejail Wine profile: /etc/firejail/wine.local
#   - Linux syscall table: /usr/include/asm/unistd_64.h
#   - strace profiling output: scripts/generate_whitelist.py
