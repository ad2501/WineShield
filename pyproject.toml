[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wineshield"
version = "1.0.0-alpha"
description = "Multi-layer security framework for Wine on Linux"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ahmed", email = "ahmad0782697665@gmail.com"},
]
keywords = ["wine", "security", "sandbox", "seccomp", "apparmor", "overlayfs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C",
    "Topic :: Security",
    "Topic :: System :: Operating System",
]

requires-python = ">=3.10"
dependencies = [
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "psutil>=5.9.0",
    "python-socketio>=5.10.0",
    "gevent>=24.0.0",
]

[project.scripts]
wineshield = "core.launcher:main"

[project.urls]
homepage = "https://github.com/ad2501/WineShield"
repository = "https://github.com/ad2501/WineShield"

[tool.pytest.ini_options]
markers = [
    "sudo: marks tests that require root privileges (deselect with '-m \"not sudo\"')",
    "slow: marks tests that are slow (deselect with '-m \"not slow\"')",
]
